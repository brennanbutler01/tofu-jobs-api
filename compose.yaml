name: tofu-jobs-local
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-synthetic-only
      POSTGRES_DB: jobs_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d jobs_demo"]
      interval: 2s
      retries: 30
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src/Tofu-Jobs-Server
    command: ["dotnet", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    volumes:
      - .:/src
      - nuget:/root/.nuget/packages
    ports: ["127.0.0.1:5212:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      LocalDemo__Enabled: "true"
      ConnectionStrings__DefaultConnectionString: Host=database;Database=jobs_demo;Username=demo;Password=local-synthetic-only
    depends_on:
      database:
        condition: service_healthy
volumes:
  nuget:
